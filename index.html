<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ready Hen Stage</title>
   <!-- my test change -->

  <!-- Full screen when opened from the Home Screen (iPhone / iPad) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ready Hen">
  <link rel="manifest" href="manifest.json">

  <!-- Adobe Edge Runtime -->
  <script src="edge_includes/edge.6.0.0.min.js"></script>

  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      background: #fff;
    }

    /* Desktop: 100% */
    #pageScale {
      width: 100%;
      transform: scale(1);
      transform-origin: top center;
    }

    /* iPads (touchscreens): 95% */
    @media (pointer: coarse) {
      #pageScale {
        transform: scale(0.95);
        margin-bottom: -5vh;
      }
    }

    /* Phones (small screens, portrait or landscape): 90% */
    @media (max-width: 600px), (pointer: coarse) and (max-height: 600px) {
      #pageScale {
        transform: scale(0.9);
        margin-bottom: -10vh;
      }
    }

    #Stage {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
    }

    .edgeLoad-words {
      visibility: hidden;
    }
  </style>

  <script>
    AdobeEdge.loadComposition('index', 'words', {
      scaleToFit: "width",
      centerStage: "horizontal",
      minW: "0px",
      maxW: "1024px",
      width: "1024px",
      height: "768px"
    }, {
      dom: [
        {
          id: 'preloader',
          type: 'image',
          tag: 'img',
          rect: ['387px', '274px', '250px', '219px', 'auto', 'auto'],
          fill: ["rgba(0,0,0,0)", 'images/preloader.png', '0px', '0px']
        }
      ],
      style: {
        '${symbolSelector}': {
          isStage: true,
          rect: [undefined, undefined, '1024px', '768px'],
          fill: ["rgba(255,255,255,1)"]
        }
      }
    }, {"dom":[]});
  </script>

  <!-- In a regular browser tab: go full screen on first tap (Android, iPad) -->
  <script>
    (function () {
      var isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches;

      if (isStandalone) return;

      function goFullscreen() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
          try { req.call(el); } catch (e) {}
        }
      }

      document.addEventListener('touchend', goFullscreen, { once: true });
      document.addEventListener('click', goFullscreen, { once: true });
    })();
  </script>

  <script src="cordova.js"></script>
</head>

<body>
  <div id="pageScale">
    <div id="Stage" class="words"></div>
  </div>
</body>
</html>
