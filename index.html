<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
	<title>Ready Hen Stage</title>
<!--Adobe Edge Runtime-->
    <script type="text/javascript" charset="utf-8" src="edge_includes/edge.6.0.0.min.js"></script>
    <style>
        .edgeLoad-words { visibility:hidden; }
    </style>
<script>
   AdobeEdge.loadComposition('index', 'words', {
    scaleToFit: "none",
    centerStage: "none",
    minW: "0px",
    maxW: "undefined",
    width: "1024px",
    height: "768px"
}, {
    dom: [
        {
            id: 'preloader',
            type: 'image',
            tag: 'img',
            rect: ['387px', '274px', '250px', '219px', 'auto', 'auto'],
            fill: ["rgba(0,0,0,0)",'images/preloader.png','0px','0px']
        }
    ],
    style: {
        '${symbolSelector}': {
            isStage: true,
            rect: [undefined, undefined, '1024px', '768px'],
            fill: ["rgba(255,255,255,1)"]
        }
    }
}, {"dom":[]});
</script>
<!--Adobe Edge Runtime End-->
